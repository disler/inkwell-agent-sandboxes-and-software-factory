<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="ts" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="thick"/>
      <feGaussianBlur in="thick" stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.95" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <style><![CDATA[
      .title { font-weight: 700; font-size: 32px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .sub   { font-size: 15px; fill: #CBD5E1; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .pname { font-weight: 700; font-size: 17px; fill: #FFFFFF; }
      .powner{ font-size: 12px; }
      .pill  { font-size: 11px; fill: #E2E8F0; }
      .dbl   { font-size: 14px; fill: #FFFFFF; }
      .cap   { font-size: 12px; fill: #94A3B8; }
      .lg    { font-size: 12px; fill: #CBD5E1; }

      .rail  { opacity: 0; stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.1s ease 0.15s forwards; }
      .bus   { opacity: 0; stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw2 0.7s ease 2.0s forwards; }
      .loopback { opacity: 0; animation: f 0.5s ease 1.5s forwards; }
      .blk   { opacity: 0; transform: translateY(10px); animation: rise 0.45s cubic-bezier(.2,.8,.3,1) forwards; }
      .b1{animation-delay:.35s} .b2{animation-delay:.55s} .b3{animation-delay:.75s}
      .b4{animation-delay:.95s} .b5{animation-delay:1.15s} .b6{animation-delay:1.35s}
      .drop  { opacity: 0; stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw2 0.5s ease forwards; }
      .d1{animation-delay:1.55s} .d2{animation-delay:1.65s} .d3{animation-delay:1.75s}
      .d4{animation-delay:1.85s} .d5{animation-delay:1.95s} .d6{animation-delay:2.05s}
      .db    { opacity: 0; transform: scale(.9); transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.4) 2.15s forwards; }
      .poll  { opacity: 0; animation: f 0.5s ease 2.45s forwards; }
      .pulse { animation: gl 2.4s ease-in-out 2.8s infinite; }
      .legend{ opacity: 0; animation: f 0.5s ease 2.6s forwards; }

      @keyframes f { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { 0%{opacity:0} 100% { opacity: .8; stroke-dashoffset: 0; } }
      @keyframes draw2 { 0%{opacity:0} 100% { opacity: .75; stroke-dashoffset: 0; } }
      @keyframes pop { to { opacity: 1; transform: scale(1); } }
      @keyframes gl { 0%,100%{ filter: drop-shadow(0 0 2px rgba(56,189,248,.25)); } 50%{ filter: drop-shadow(0 0 9px rgba(56,189,248,.7)); } }
    
      @media (prefers-reduced-motion: reduce) {
        * { opacity: 1 !important; animation: none !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    ]]></style>
  </defs>

  <text filter="url(#ts)" class="title" x="590" y="52" text-anchor="middle">Agent proposes. Code disposes.</text>
  <text filter="url(#ts)" class="sub mono" x="590" y="88" text-anchor="middle">just sdlc "add a /health endpoint"</text>

  <!-- the deterministic rail -->
  <line class="rail" x1="60" y1="258" x2="1120" y2="258" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <text filter="url(#ts)" class="cap mono" x="60" y="196">adws/adw_plan_build_test.py &#8212; deterministic control plane</text>

  <!-- phase blocks -->
  <g class="blk b1">
    <rect x="85" y="220" width="150" height="76" rx="11" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <text filter="url(#ts)" class="pname" x="160" y="252" text-anchor="middle">request</text>
    <text filter="url(#ts)" class="powner mono" x="160" y="276" text-anchor="middle" fill="#A78BFA">engineer</text>
  </g>
  <g class="blk b2">
    <rect x="257" y="220" width="150" height="76" rx="11" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text filter="url(#ts)" class="pname" x="332" y="252" text-anchor="middle">plan</text>
    <text filter="url(#ts)" class="powner mono" x="332" y="276" text-anchor="middle" fill="#38BDF8">planner</text>
    <rect x="257" y="308" width="150" height="26" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text filter="url(#ts)" class="pill mono" x="332" y="326" text-anchor="middle">envelope + gates</text>
  </g>
  <g class="blk b3">
    <rect x="429" y="220" width="150" height="76" rx="11" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text filter="url(#ts)" class="pname" x="504" y="252" text-anchor="middle">build</text>
    <text filter="url(#ts)" class="powner mono" x="504" y="276" text-anchor="middle" fill="#38BDF8">builder</text>
    <rect x="429" y="308" width="150" height="26" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text filter="url(#ts)" class="pill mono" x="504" y="326" text-anchor="middle">envelope + gates</text>
  </g>
  <g class="blk b4">
    <rect x="601" y="220" width="150" height="76" rx="11" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text filter="url(#ts)" class="pname" x="676" y="252" text-anchor="middle">test_1</text>
    <text filter="url(#ts)" class="powner mono" x="676" y="276" text-anchor="middle" fill="#38BDF8">tester</text>
  </g>
  <g class="blk b5">
    <rect x="773" y="220" width="150" height="76" rx="11" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text filter="url(#ts)" class="pname" x="848" y="252" text-anchor="middle">fix_1</text>
    <text filter="url(#ts)" class="powner mono" x="848" y="276" text-anchor="middle" fill="#38BDF8">builder</text>
    <rect x="773" y="308" width="150" height="26" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text filter="url(#ts)" class="pill mono" x="848" y="326" text-anchor="middle">envelope + gates</text>
  </g>
  <!-- bounded fix loop: fix_1 back to test_2 -->
  <path class="loopback" d="M848,216 C848,176 676,176 676,214" fill="none" stroke="#64748B"
        stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text filter="url(#ts)" class="cap mono" x="762" y="170" text-anchor="middle">bounded &#215;3</text>
  <g class="blk b6">
    <rect x="945" y="220" width="150" height="76" rx="11" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <text filter="url(#ts)" class="pname" x="1020" y="252" text-anchor="middle">commit</text>
    <text filter="url(#ts)" class="powner mono" x="1020" y="276" text-anchor="middle" fill="#34D399">git</text>
  </g>

  <!-- event drops into the trace db -->
  <g fill="none" stroke="#94A3B8" stroke-width="1.4">
    <path class="drop d1" d="M160,300 L160,396"/>
    <path class="drop d2" d="M332,338 L332,396"/>
    <path class="drop d3" d="M504,338 L504,396"/>
    <path class="drop d4" d="M676,300 L676,396"/>
    <path class="drop d5" d="M848,338 L848,396"/>
    <path class="drop d6" d="M1020,300 L1020,396"/>
    <path class="bus" d="M160,396 L1020,396"/>
    <path class="drop d6" d="M550,396 L550,436" stroke-width="2" marker-end="url(#ag)"/>
  </g>
  <text filter="url(#ts)" class="cap mono" x="60" y="470">tracer.py writes</text>
  <text filter="url(#ts)" class="cap mono" x="60" y="490">every event, live</text>

  <!-- sqlite db -->
  <g class="db">
    <g class="pulse">
      <rect x="360" y="440" width="380" height="74" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2.2"/>
    </g>
    <text filter="url(#ts)" class="dbl mono" x="550" y="472" text-anchor="middle">adws/adw_data/sssf.db</text>
    <text filter="url(#ts)" class="cap mono" x="550" y="496" text-anchor="middle">sqlite &#183; WAL &#183; 6 tables</text>
  </g>

  <!-- poll -->
  <g class="poll">
    <line x1="740" y1="477" x2="850" y2="477" stroke="#E2E8F0" stroke-width="2" marker-end="url(#aw)"/>
    <text filter="url(#ts)" class="cap mono" x="795" y="464" text-anchor="middle">poll 500ms</text>
    <rect x="858" y="440" width="240" height="74" rx="12" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.6"/>
    <text filter="url(#ts)" class="dbl mono" x="978" y="472" text-anchor="middle">just phases / just tail</text>
    <text filter="url(#ts)" class="cap mono" x="978" y="496" text-anchor="middle">reads only &#183; never blocked</text>
  </g>

  <!-- legend -->
  <g class="legend">
    <rect x="60" y="556" width="14" height="14" rx="4" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <text filter="url(#ts)" class="lg mono" x="84" y="568">engineer</text>
    <rect x="176" y="556" width="14" height="14" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text filter="url(#ts)" class="lg mono" x="200" y="568">agent</text>
    <rect x="272" y="556" width="14" height="14" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <text filter="url(#ts)" class="lg mono" x="296" y="568">code</text>
    <text filter="url(#ts)" class="lg" x="1120" y="568" text-anchor="end">every phase defaults to fail &#183; success is earned</text>
  </g>
</svg>
